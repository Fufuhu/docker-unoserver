name: Dockerfile Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .hadolint.yaml

jobs:
  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          format: json
          output-file: hadolint-results.json
          no-fail: true

      - name: Post results as PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hadolint-result -->';
            const icons = { error: '❌', warning: '⚠️', info: 'ℹ️', style: '📝' };

            let body;
            try {
              const raw = fs.readFileSync('hadolint-results.json', 'utf8').trim();
              const results = raw && raw !== '[]' ? JSON.parse(raw) : [];

              if (results.length === 0) {
                body = `${marker}\n## ✅ Dockerfile Lint (Hadolint)\n\n問題は検出されませんでした。`;
              } else {
                const errorCount  = results.filter(r => r.level === 'error').length;
                const warnCount   = results.filter(r => r.level === 'warning').length;
                const summary = [
                  errorCount ? `❌ error: ${errorCount}` : null,
                  warnCount  ? `⚠️ warning: ${warnCount}` : null,
                ].filter(Boolean).join(' / ');

                const rows = results.map(r => {
                  const icon = icons[r.level] ?? r.level;
                  return `| ${icon} \`${r.level}\` | [${r.code}](https://github.com/hadolint/hadolint/wiki/${r.code}) | L${r.line} | ${r.message} |`;
                }).join('\n');

                body = `${marker}\n## ⚠️ Dockerfile Lint (Hadolint)\n\n${summary}\n\n| 深刻度 | ルール | 行 | メッセージ |\n|--------|--------|-----|------------|\n${rows}`;
              }
            } catch (e) {
              body = `${marker}\n## Dockerfile Lint (Hadolint)\n\n結果の取得に失敗しました: ${e.message}`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on errors
        run: |
          if [ ! -f hadolint-results.json ]; then exit 0; fi
          error_count=$(jq '[.[] | select(.level == "error")] | length' hadolint-results.json)
          if [ "$error_count" -gt 0 ]; then
            echo "Hadolint が ${error_count} 件のエラーを検出しました。修正してください。"
            jq -r '.[] | select(.level == "error") | "L\(.line): [\(.code)] \(.message)"' hadolint-results.json
            exit 1
          fi
